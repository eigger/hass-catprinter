name: Update dependencies
'on':
  schedule:
  - cron: 41 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@v1.1.5
    with:
      domain: catprinter
      packages: '["imagespec", "blesession"]'
      python-version: '3.14'
      ha-components: bluetooth recorder image sensor binary_sensor
      test-profile: ha
      validation-command: python -m ruff check . && python -m ruff format --check
        . && python -m pytest tests/components/catprinter/ --ignore=tests/components/catprinter/test_payload_examples.py
        -v
