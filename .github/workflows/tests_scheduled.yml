name: Scheduled tests
'on':
  schedule:
  - cron: 23 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.0
    with:
      domain: catprinter
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test.txt
      expected-ha-version: 2026.10.2
      test-profile: ha
      ha-components: bluetooth recorder image sensor binary_sensor
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["imagespec", "blesession"]'
      standards-ref: 44349ee5621eea5d80e5c427f7a2435d2c2491bb
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.0
    with:
      domain: catprinter
      python-versions: '["3.13"]'
      lint-python-version: '3.14'
      requirements: requirements_test_min.txt
      expected-ha-version: 2025.2.0
      test-profile: ha
      ha-components: bluetooth recorder image sensor binary_sensor
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["imagespec", "blesession"]'
      standards-ref: 44349ee5621eea5d80e5c427f7a2435d2c2491bb
